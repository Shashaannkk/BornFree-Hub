<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Request a password reset link for your BONFREE-HUB Loyalty Club account."
    />
    <meta name="bonfree-env" content="development" />
    <title>Forgot Password — BONFREE-HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/public.css" />
    <link rel="stylesheet" href="src/styles/auth.css" />
  </head>
  <body data-page="forgot-password">
    <header id="site-header"></header>

    <main>
      <section class="auth-split">
        <div class="auth-split__media">
          <img
            src="assets/images/auth-reset.jpg"
            alt="Gen Z streetwear model seated on concrete steps in oversized denim jacket, hoodie, sunglasses, and headphones"
            class="auth-split__img"
            loading="eager"
          />
          <div class="auth-split__scrim" aria-hidden="true"></div>
          <div class="auth-split__media-inner">
            <span class="eyebrow eyebrow--inverse">ACCOUNT HELP</span>
            <h1 class="auth-split__media-title">Reset<br />Password</h1>
            <p class="auth-split__media-copy">
              No worries. We'll help you reset your password and get back to your BONFREE-HUB
              account in no time.
            </p>
          </div>
        </div>

        <div class="auth-split__panel">
          <div class="auth-panel-box">
            <div class="stack" style="gap: 0.35rem">
              <h2 class="auth-panel-box__title">Reset Your Password</h2>
              <p class="auth-panel-box__subtitle">
                Enter your registered email address and we'll send you a link to reset your
                password.
              </p>
            </div>

            <div id="form-status-region" aria-live="polite"></div>

            <form id="forgot-password-form" class="form-stack" novalidate>
              <div class="field">
                <label class="field__label" for="forgot-email">
                  Email Address <span class="field__required">*</span>
                </label>
                <div class="input-wrap">
                  <span class="input-wrap__icon" data-icon="mail" data-icon-size="16"></span>
                  <input
                    id="forgot-email"
                    name="email"
                    type="email"
                    class="input input--has-icon"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                  />
                </div>
              </div>

              <button type="submit" class="btn btn--primary btn--lg btn--block">
                SEND RESET LINK
              </button>
            </form>

            <p class="auth-switch-note">
              <a href="login.html" class="auth-link">Back to Sign In</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="src/scripts/main.js"></script>
  </body>
</html>
