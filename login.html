<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to your BONFREE-HUB loyalty account to track stamps, redeem vouchers, and access member perks."
    />
    <meta name="bonfree-env" content="development" />
    <title>Customer Login — BONFREE-HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/reset.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <link rel="stylesheet" href="src/styles/public.css" />
    <link rel="stylesheet" href="src/styles/auth.css" />
  </head>
  <body data-page="login">
    <header id="site-header"></header>

    <main>
      <section class="auth-split">
        <div class="auth-split__media">
          <img
            src="assets/images/auth-login.jpg"
            alt="Gen Z streetwear model seated on concrete steps in a white crop top, draped black track jacket, and baggy cargo jeans"
            class="auth-split__img"
            loading="eager"
          />
          <div class="auth-split__scrim" aria-hidden="true"></div>
          <div class="auth-split__media-inner">
            <span class="eyebrow eyebrow--inverse">MEMBER ACCESS</span>
            <h1 class="auth-split__media-title">Customer<br />Login</h1>
            <p class="auth-split__media-copy">
              Sign in to your BONFREE-HUB account to track purchases, enjoy loyalty rewards and get
              exclusive benefits.
            </p>
          </div>
        </div>

        <div class="auth-split__panel">
          <div class="auth-panel-box">
            <div class="stack" style="gap: 0.35rem">
              <h2 class="auth-panel-box__title">Welcome Back</h2>
              <p class="auth-panel-box__subtitle">Sign in to your BONFREE-HUB account.</p>
            </div>

            <div id="form-status-region" aria-live="polite"></div>

            <form id="login-form" class="form-stack" novalidate>
              <div class="field">
                <label class="field__label" for="login-email">
                  Email Address <span class="field__required">*</span>
                </label>
                <div class="input-wrap">
                  <span class="input-wrap__icon" data-icon="mail" data-icon-size="16"></span>
                  <input
                    id="login-email"
                    name="email"
                    type="email"
                    class="input input--has-icon"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                  />
                </div>
              </div>

              <div class="field">
                <label class="field__label" for="login-password">
                  Password <span class="field__required">*</span>
                </label>
                <div class="input-wrap">
                  <span class="input-wrap__icon" data-icon="lock" data-icon-size="16"></span>
                  <input
                    id="login-password"
                    name="password"
                    type="password"
                    class="input input--has-icon input--has-action"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                  />
                  <button
                    type="button"
                    class="input-wrap__action"
                    data-password-toggle="login-password"
                    aria-label="Show password"
                  >
                    <span data-icon="eye" data-icon-size="16"></span>
                  </button>
                </div>
              </div>

              <div class="auth-inline-row">
                <span class="text-xs text-muted">Authenticated via Supabase Auth</span>
                <a href="forgot-password.html" class="auth-link">Forgot Password?</a>
              </div>

              <button type="submit" class="btn btn--primary btn--lg btn--block">SIGN IN</button>
            </form>

            <p class="auth-switch-note">
              New to BONFREE-HUB? <a href="register.html" class="auth-link">Join Now</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="src/scripts/main.js"></script>
  </body>
</html>
