<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BONFREE-HUB Admin Customers Directory — Search, filter, inspect member profiles, stamp balances, and activity history."
    />
    <meta name="bonfree-env" content="development" />
    <title>Customers — BONFREE-HUB Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/reset.css" />
    <link rel="stylesheet" href="../src/styles/layout.css" />
    <link rel="stylesheet" href="../src/styles/components.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/admin.css" />
  </head>
  <body data-page="admin-customers">
    <div class="admin-shell">
      <aside id="admin-sidebar-host"></aside>

      <div class="admin-main">
        <header id="admin-topbar-host"></header>

        <main class="admin-content">
          <div class="admin-page-head">
            <div class="stack" style="gap: 0.25rem">
              <span class="eyebrow">CUSTOMERS</span>
              <h1 class="page-title">Customers</h1>
              <p class="text-sm text-muted">
                Manage loyalty members, inspect stamp balances, and review activity history.
              </p>
            </div>

            <div class="cluster">
              <button type="button" id="cust-toggle-loading-btn" class="btn btn--outline-muted btn--sm">
                Toggle Loading State
              </button>
              <button type="button" id="add-customer-btn" class="btn btn--primary">
                + Add Customer
              </button>
            </div>
          </div>

          <div class="stack" style="gap: 1.25rem">
            <div class="filter-toolbar" role="search" aria-label="Filter customers">
              <input
                id="cust-search-input"
                type="search"
                class="input"
                placeholder="Search by ID, name, email or phone..."
                aria-label="Search customers by name, ID, email or phone"
              />
              <select id="cust-status-filter" class="select" aria-label="Filter by status">
                <option value="all">All Statuses</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
              <select id="cust-programme-filter" class="select" aria-label="Filter by programme">
                <option value="all">All Programmes</option>
                <option value="Classic Stamps">Classic Stamps</option>
                <option value="Premium Circle">Premium Circle</option>
                <option value="Streetwear Club">Streetwear Club</option>
              </select>
              <select id="cust-sort-select" class="select" aria-label="Sort customers">
                <option value="joined-desc">Sort: Joined Date</option>
                <option value="stamps-desc">Sort: Highest Stamps</option>
                <option value="name-asc">Sort: Name (A–Z)</option>
              </select>
              <button type="button" id="cust-apply-btn" class="btn btn--primary">Apply</button>
              <button type="button" id="cust-clear-btn" class="btn btn--outline-muted">Clear</button>
            </div>

            <div id="admin-customers-table"></div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="../src/scripts/adminMain.js"></script>
  </body>
</html>
