<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BONFREE-HUB Purchase Records — Review member receipts, qualifying status, purchase totals, and CSV export."
    />
    <meta name="bonfree-env" content="development" />
    <title>Purchase Records — BONFREE-HUB Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/reset.css" />
    <link rel="stylesheet" href="../src/styles/layout.css" />
    <link rel="stylesheet" href="../src/styles/components.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/admin.css" />
  </head>
  <body data-page="admin-purchases">
    <div class="admin-shell">
      <aside id="admin-sidebar-host"></aside>

      <div class="admin-main">
        <header id="admin-topbar-host"></header>

        <main class="admin-content">
          <div class="admin-page-head">
            <div class="stack" style="gap: 0.25rem">
              <span class="eyebrow">RECEIPTS &amp; QUALIFICATION</span>
              <h1 class="page-title">Purchase Records</h1>
              <p class="text-sm text-muted">
                View and audit member purchases, receipts, and loyalty stamp qualification.
              </p>
            </div>
            <button type="button" id="pur-export-csv-btn" class="btn btn--primary">
              Export CSV
            </button>
          </div>

          <div class="stack" style="gap: 1.25rem">
            <div class="stamps-toolbar" role="search" aria-label="Filter purchase records">
              <input
                id="pur-search"
                type="search"
                class="input"
                placeholder="Search receipt #, member name/ID or item..."
                aria-label="Search purchase records"
              />
              <input id="pur-date-from" type="date" class="input" aria-label="From date" />
              <input id="pur-date-to" type="date" class="input" aria-label="To date" />
              <select id="pur-status" class="select" aria-label="Filter by qualifying status">
                <option value="all">All Status</option>
                <option value="qualifying">Qualifying</option>
                <option value="not-qualifying">Not Qualifying</option>
              </select>
              <select id="pur-sort" class="select" aria-label="Sort purchase records">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="amount-desc">Highest Amount</option>
              </select>
              <button type="button" id="pur-apply-btn" class="btn btn--primary">Apply</button>
              <button type="button" id="pur-clear-btn" class="btn btn--outline-muted">Clear</button>
            </div>

            <div id="pur-kpis" class="grid grid-4"></div>

            <div id="admin-purchases-table"></div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="../src/scripts/adminMain.js"></script>
  </body>
</html>
