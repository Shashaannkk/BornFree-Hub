<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BONFREE-HUB Analytics — Customer growth, stamp issuance, redemption conversion, and programme performance."
    />
    <meta name="bonfree-env" content="development" />
    <title>Analytics — BONFREE-HUB Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/reset.css" />
    <link rel="stylesheet" href="../src/styles/layout.css" />
    <link rel="stylesheet" href="../src/styles/components.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/admin.css" />
  </head>
  <body data-page="admin-analytics">
    <div class="admin-shell">
      <aside id="admin-sidebar-host"></aside>

      <div class="admin-main">
        <header id="admin-topbar-host"></header>

        <main class="admin-content">
          <div class="admin-page-head">
            <div class="stack" style="gap: 0.25rem">
              <span class="eyebrow">INSIGHTS</span>
              <h1 class="page-title">Analytics</h1>
              <p class="text-sm text-muted">
                Loyalty performance, stamp issuance trends, and customer insights for BONFREE-HUB.
              </p>
            </div>

            <div class="cluster">
              <select
                id="analytics-period"
                class="select"
                style="width: auto"
                aria-label="Analytics period filter"
              >
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly" selected>Monthly (Last 30 Days)</option>
                <option value="custom">Custom Date Range</option>
              </select>

              <div id="analytics-custom-range" class="cluster" hidden>
                <input type="date" class="input" style="width: auto" aria-label="Custom start date" />
                <input type="date" class="input" style="width: auto" aria-label="Custom end date" />
                <button type="button" id="analytics-custom-apply" class="btn btn--primary btn--sm">
                  Apply
                </button>
              </div>
            </div>
          </div>

          <div id="admin-analytics-host" class="stack" style="gap: 1.5rem"></div>
        </main>
      </div>
    </div>

    <script type="module" src="../src/scripts/adminMain.js"></script>
  </body>
</html>
