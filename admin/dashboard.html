<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BONFREE-HUB Admin Overview — Loyalty performance metrics, customer growth, recent registrations, and stamp activity."
    />
    <meta name="bonfree-env" content="development" />
    <title>Overview — BONFREE-HUB Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/reset.css" />
    <link rel="stylesheet" href="../src/styles/layout.css" />
    <link rel="stylesheet" href="../src/styles/components.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/admin.css" />
  </head>
  <body data-page="admin-overview">
    <div class="admin-shell">
      <aside id="admin-sidebar-host"></aside>

      <div class="admin-main">
        <header id="admin-topbar-host"></header>

        <main class="admin-content">
          <div class="admin-page-head">
            <div class="stack" style="gap: 0.25rem">
              <span class="eyebrow">ADMIN</span>
              <h1 class="page-title">Overview</h1>
              <p class="text-sm text-muted">BONFREE-HUB loyalty performance at a glance</p>
            </div>

            <div class="cluster">
              <div class="segmented" role="group" aria-label="Preview overview states">
                <button type="button" class="segmented__btn is-active" data-admin-state="ready">
                  Live Dev
                </button>
                <button type="button" class="segmented__btn" data-admin-state="loading">
                  Loading
                </button>
                <button type="button" class="segmented__btn" data-admin-state="empty">
                  Empty
                </button>
                <button type="button" class="segmented__btn" data-admin-state="error">
                  Error
                </button>
              </div>

              <select
                id="overview-range-select"
                class="select"
                style="width: auto"
                aria-label="Select date range"
              >
                <option value="7d">Last 7 Days</option>
                <option value="30d" selected>Last 30 Days</option>
                <option value="90d">Last 90 Days</option>
                <option value="1y">Last 12 Months</option>
              </select>
            </div>
          </div>

          <div id="admin-overview-host" class="stack" style="gap: 1.5rem" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <script type="module" src="../src/scripts/adminMain.js"></script>
  </body>
</html>
