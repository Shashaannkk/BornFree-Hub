<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BONFREE-HUB Surveys — Build feedback surveys, manage questions, collect responses, and analyze insights."
    />
    <meta name="bonfree-env" content="development" />
    <title>Surveys — BONFREE-HUB Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/reset.css" />
    <link rel="stylesheet" href="../src/styles/layout.css" />
    <link rel="stylesheet" href="../src/styles/components.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/admin.css" />
  </head>
  <body data-page="admin-surveys">
    <div class="admin-shell">
      <aside id="admin-sidebar-host"></aside>

      <div class="admin-main">
        <header id="admin-topbar-host"></header>

        <main class="admin-content">
          <div class="admin-page-head">
            <div class="stack" style="gap: 0.25rem">
              <span class="eyebrow">CUSTOMER FEEDBACK</span>
              <h1 class="page-title">Surveys</h1>
              <p class="text-sm text-muted">
                Build feedback surveys, collect member responses, and analyze streetwear insights.
              </p>
            </div>
            <div class="cluster">
              <a href="../survey.html" class="btn btn--outline-muted">Customer Survey View</a>
              <button type="button" id="create-survey-btn" class="btn btn--primary">
                + Create Survey
              </button>
            </div>
          </div>

          <div class="stack" style="gap: 1.25rem">
            <div id="surveys-tabs" class="tabs" role="tablist" aria-label="Survey workspace"></div>
            <div id="surveys-panel-host"></div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="../src/scripts/adminMain.js"></script>
  </body>
</html>
