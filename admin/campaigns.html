<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BONFREE-HUB Campaigns — Create and schedule streetwear loyalty promotions, bonus stamp weekends, and member offers."
    />
    <meta name="bonfree-env" content="development" />
    <title>Campaigns — BONFREE-HUB Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/styles/reset.css" />
    <link rel="stylesheet" href="../src/styles/layout.css" />
    <link rel="stylesheet" href="../src/styles/components.css" />
    <link rel="stylesheet" href="../src/styles/auth.css" />
    <link rel="stylesheet" href="../src/styles/admin.css" />
  </head>
  <body data-page="admin-campaigns">
    <div class="admin-shell">
      <aside id="admin-sidebar-host"></aside>

      <div class="admin-main">
        <header id="admin-topbar-host"></header>

        <main class="admin-content">
          <div class="admin-page-head">
            <div class="stack" style="gap: 0.25rem">
              <span class="eyebrow">PROMOTIONS</span>
              <h1 class="page-title">Campaigns</h1>
              <p class="text-sm text-muted">
                Create and manage loyalty campaigns, streetwear drops, and member offers.
              </p>
            </div>
            <button type="button" id="create-campaign-btn" class="btn btn--primary">
              + Create Campaign
            </button>
          </div>

          <div class="stack" style="gap: 1.25rem">
            <div id="campaigns-kpis" class="grid grid-4"></div>
            <div id="campaigns-tabs" class="tabs" role="tablist" aria-label="Campaign status"></div>
            <div id="admin-campaigns-grid" class="campaigns-grid"></div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="../src/scripts/adminMain.js"></script>
  </body>
</html>
